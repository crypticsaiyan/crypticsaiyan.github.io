<!doctype html>
<html lang="en" data-webtui-theme="catppuccin-mocha">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Rahul Joshi | Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Rahul Joshi (crypticsaiyan), a CS undergrad at IIT Dhanbad passionate about web development, low-level systems, and computer science."
    />
    <meta name="author" content="Rahul Joshi" />
    <meta
      name="keywords"
      content="Rahul Joshi, crypticsaiyan, portfolio, web developer, IIT Dhanbad, computer science, software engineer, low-level systems"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#11111b" />
    <link rel="canonical" href="https://crypticsaiyan.me/" />

    <!-- Open Graph (Facebook, LinkedIn, Discord, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rahul Joshi | Portfolio" />
    <meta property="og:url" content="https://crypticsaiyan.me/" />
    <meta
      property="og:title"
      content="Rahul Joshi | Developer &amp; CS Undergrad @ IIT Dhanbad"
    />
    <meta
      property="og:description"
      content="Portfolio of Rahul Joshi (crypticsaiyan): web development, low-level systems, and everything computer science."
    />
    <meta
      property="og:image"
      content="https://crypticsaiyan.me/assets/images/og-image.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Rahul Joshi's terminal-style portfolio homepage"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@_crypticsaiyan" />
    <meta
      name="twitter:title"
      content="Rahul Joshi | Developer &amp; CS Undergrad @ IIT Dhanbad"
    />
    <meta
      name="twitter:description"
      content="Portfolio of Rahul Joshi (crypticsaiyan): web development, low-level systems, and everything computer science."
    />
    <meta
      name="twitter:image"
      content="https://crypticsaiyan.me/assets/images/og-image.jpg"
    />

    <!-- Structured data (Person, projects, ...) is generated from
         src/data/aeo.js and injected here by scripts/prerender.mjs -->
    <!--structured-data-->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- font CSS loads without blocking first paint; text swaps in -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&amp;display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <!-- icon font subset (scripts/fa-subset.py), a few KB each -->
    <link
      rel="preload"
      href="/assets/fonts/fa-solid-900.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/fa-brands-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="/assets/favicon/site.webmanifest" />
    <script
      data-goatcounter="https://crypticsaiyan.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&amp;display=swap" />
      <!-- content is prerendered; without JS just drop the custom cursor -->
      <style>
        .cursor {
          display: none !important;
        }

        * {
          cursor: auto !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
